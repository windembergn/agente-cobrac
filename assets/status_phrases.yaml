# Frases de "ainda estou trabalhando" — PT-BR, tom de secretario clinico.
#
# Sem isto o Hermes manda "⏳ Working — 3 min — running: terminal" no grupo do
# cirurgiao: ingles e nome de ferramenta, as duas coisas proibidas pela persona.
# Com `long_running_notifications: generic` o gateway sorteia daqui, evitando
# repetir a ultima usada.
#
# Duas categorias, e so' essas duas existem (gateway/status_phrases.py:
# classify_status_context): "status" = o heartbeat de tarefa longa;
# "generic" = o resto do chatter de status.
#
# Regra ao editar: frase curta, humana, sem jargao, sem prometer prazo. Ela
# aparece SOZINHA no grupo, no meio de uma tarefa demorada.

# `replace` troca o catalogo em ingles em vez de somar ao dele — sem isto o
# sorteio cairia em "still on it" metade das vezes.
mode: replace

